name: Electron desktop
on:
  push:
    paths:
      [
        "electron-ui/**",
        "trainer/gui/**",
        "trainer/ui_core/**",
        "trainer/electron_backend/**",
        "trainer/tools/**",
        "tests/**",
        "scripts/electron.cjs",
        "*-electron.*",
        ".github/workflows/electron-ui.yml",
      ]
  pull_request:
    paths:
      [
        "electron-ui/**",
        "trainer/gui/**",
        "trainer/ui_core/**",
        "trainer/electron_backend/**",
        "trainer/tools/**",
        "tests/**",
        "scripts/electron.cjs",
        "*-electron.*",
        ".github/workflows/electron-ui.yml",
      ]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron-ui/package-lock.json
      - name: CPU dependencies for desktop contracts
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy pillow toml safetensors einops loguru PySide6 packaging
      - run: npm --prefix electron-ui ci
      - run: node electron-ui/node_modules/electron/install.js
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: node electron-ui/node_modules/playwright/cli.js install-deps chromium
      - run: python -m trainer.electron_backend --check
      - name: Backend and existing GUI contracts
        shell: bash
        run: python -m pytest tests/test_electron*.py tests/test_gui*.py tests/test_timestep*.py tests/test_moss_timestep_distribution.py tests/test_lora_utilities.py tests/test_moss_export.py tests/test_recover_config.py -q
      - run: npm --prefix electron-ui run build
      - run: npm --prefix electron-ui test
      - name: Electron workflows (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BLUFLOW_PYTHON = (Get-Command python).Source
          npm --prefix electron-ui run test:ui
      - name: Electron workflows (Linux)
        if: runner.os == 'Linux'
        run: BLUFLOW_PYTHON="$(command -v python)" xvfb-run -a npm --prefix electron-ui run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-captures-${{ matrix.os }}
          path: |
            .artifacts/electron-smoke/*.png
            .artifacts/electron-startup/*.png
